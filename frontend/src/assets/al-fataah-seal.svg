<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <path id="topArc" d="M 30,110 A 80,80 0 0 1 190,110" />
    <path id="bottomArc" d="M 38,150 A 80,80 0 0 0 182,150" />
  </defs>

  <!-- outer rings -->
  <circle cx="110" cy="110" r="107" fill="#1a7a34" />
  <circle cx="110" cy="110" r="103" fill="#e21b1b" />
  <circle cx="110" cy="110" r="84" fill="#1a7a34" />
  <circle cx="110" cy="110" r="81" fill="#ffffff" />

  <!-- arched red-band text -->
  <text fill="#ffffff" font-family="'Cairo','Segoe UI',sans-serif" font-weight="800" font-size="13">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">مركز الفتاح للعلوم الشرعية</textPath>
  </text>
  <text fill="#ffffff" font-family="Arial, sans-serif" font-weight="800" font-size="10.5" letter-spacing="0.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">XARUNTA BARASHADA CULUUMTA SHARCIGA EE AL-FATAAX</textPath>
  </text>

  <!-- stars -->
  <g fill="#ffffff">
    <path transform="translate(28,96) scale(0.55)" d="M10 0 L12.9 6.9 L20 7.6 L14.5 12.4 L16.2 19.4 L10 15.6 L3.8 19.4 L5.5 12.4 L0 7.6 L7.1 6.9 Z" />
    <path transform="translate(184,96) scale(0.55)" d="M10 0 L12.9 6.9 L20 7.6 L14.5 12.4 L16.2 19.4 L10 15.6 L3.8 19.4 L5.5 12.4 L0 7.6 L7.1 6.9 Z" />
  </g>

  <!-- "الفتاح" script -->
  <text x="110" y="70" fill="#e21b1b" font-family="'Amiri','Times New Roman',serif" font-style="italic" font-weight="700" font-size="19" text-anchor="middle">الفتاح</text>

  <!-- laurel wreath -->
  <g fill="#2f9e44">
    <g id="leafStackLeft">
      <ellipse cx="55" cy="185" rx="7" ry="3.4" transform="rotate(-35 55 185)" />
      <ellipse cx="50" cy="175" rx="7.5" ry="3.6" transform="rotate(-25 50 175)" />
      <ellipse cx="47" cy="163" rx="8" ry="3.8" transform="rotate(-14 47 163)" />
      <ellipse cx="45" cy="150" rx="8.3" ry="4" transform="rotate(-4 45 150)" />
      <ellipse cx="45" cy="137" rx="8.3" ry="4" transform="rotate(6 45 137)" />
      <ellipse cx="47" cy="124" rx="8" ry="3.8" transform="rotate(16 47 124)" />
      <ellipse cx="51" cy="112" rx="7.6" ry="3.6" transform="rotate(28 51 112)" />
      <ellipse cx="57" cy="101" rx="7.2" ry="3.4" transform="rotate(40 57 101)" />
      <ellipse cx="65" cy="92" rx="6.8" ry="3.2" transform="rotate(52 65 92)" />
    </g>
    <g id="leafStackRight" transform="translate(220,0) scale(-1,1)">
      <ellipse cx="55" cy="185" rx="7" ry="3.4" transform="rotate(-35 55 185)" />
      <ellipse cx="50" cy="175" rx="7.5" ry="3.6" transform="rotate(-25 50 175)" />
      <ellipse cx="47" cy="163" rx="8" ry="3.8" transform="rotate(-14 47 163)" />
      <ellipse cx="45" cy="150" rx="8.3" ry="4" transform="rotate(-4 45 150)" />
      <ellipse cx="45" cy="137" rx="8.3" ry="4" transform="rotate(6 45 137)" />
      <ellipse cx="47" cy="124" rx="8" ry="3.8" transform="rotate(16 47 124)" />
      <ellipse cx="51" cy="112" rx="7.6" ry="3.6" transform="rotate(28 51 112)" />
      <ellipse cx="57" cy="101" rx="7.2" ry="3.4" transform="rotate(40 57 101)" />
      <ellipse cx="65" cy="92" rx="6.8" ry="3.2" transform="rotate(52 65 92)" />
    </g>
    <path d="M 55 185 Q 110 200 165 185" stroke="#2f9e44" stroke-width="2.5" fill="none" />
  </g>

  <!-- sunburst -->
  <g fill="#f7b500">
    <path d="M110 128 L104 90 L110 78 L116 90 Z" />
    <path d="M110 128 L88 96 L88 84 L100 94 Z" />
    <path d="M110 128 L72 108 L68 97 L84 102 Z" />
    <path d="M110 128 L132 96 L132 84 L120 94 Z" />
    <path d="M110 128 L148 108 L152 97 L136 102 Z" />
  </g>

  <!-- book + rising figure -->
  <path d="M110 132 L66 112 Q64 148 82 156 Q96 160 110 148 Z" fill="#e21b1b" />
  <path d="M110 132 L154 112 Q156 148 138 156 Q124 160 110 148 Z" fill="#e21b1b" />
  <path d="M110 132 L82 156 Q96 162 110 152 Z" fill="#1a7a34" opacity="0.55" />
  <path d="M110 132 L138 156 Q124 162 110 152 Z" fill="#1a7a34" opacity="0.55" />
  <circle cx="110" cy="122" r="8" fill="#1a7a34" />

  <!-- crossed base flourish -->
  <path d="M84 160 L136 160 L110 190 Z" fill="none" stroke="#e21b1b" stroke-width="5" stroke-linejoin="round" />
  <path d="M92 165 L128 165 L110 184 Z" fill="none" stroke="#1a7a34" stroke-width="3.5" stroke-linejoin="round" />

  <!-- small torch/key at base -->
  <circle cx="110" cy="182" r="5" fill="#f7b500" />
  <rect x="108" y="182" width="4" height="10" fill="#f7b500" />
</svg>
